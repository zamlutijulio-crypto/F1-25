<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 2D Racing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #0f1318;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      background: #1e3822;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      max-width: 100%;
      max-height: 100%;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      font-family: monospace;
      font-size: 1.1rem;
    }
    #menu {
      position: absolute;
      background: rgba(15, 19, 24, 0.95);
      border: 2px solid #e10600;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
    }
    #menu h1 { color: #e10600; margin-bottom: 10px; font-size: 2.2rem; }
    #menu p { color: #aaa; margin-bottom: 25px; }
    #menu button {
      background: #e10600;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    #menu button:hover { background: #b30500; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="ui" class="hidden">
      <div>Volta: <span id="ui-lap">1 / 3</span></div>
      <div>Velocidade: <span id="ui-speed">0</span> km/h</div>
      <div>Tempo: <span id="ui-time">00:00.000</span></div>
      <div>Status: <span id="ui-status" style="color: #4cd137;">PISTA</span></div>
    </div>

    <div id="menu">
      <h1>FÓRMULA 1 2D</h1>
      <p>Controles: Setas ou W, A, S, D para pilotar</p>
      <button id="btn-play">INICIAR CORRIDA</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const ui = document.getElementById('ui');
    const menu = document.getElementById('menu');
    const btnPlay = document.getElementById('btn-play');
    const uiLap = document.getElementById('ui-lap');
    const uiSpeed = document.getElementById('ui-speed');
    const uiTime = document.getElementById('ui-time');
    const uiStatus = document.getElementById('ui-status');

    let isPlaying = false;
    let lap = 1;
    const totalLaps = 3;
    let startTime = 0;
    let nextCheckpoint = 1;

    // Traçado da Pista
    const waypoints = [
      { x: 250, y: 580 }, { x: 640, y: 580 }, { x: 1050, y: 580 },
      { x: 1150, y: 450 }, { x: 1050, y: 200 }, { x: 750, y: 180 },
      { x: 600, y: 300 }, { x: 450, y: 300 }, { x: 300, y: 180 },
      { x: 150, y: 300 }, { x: 150, y: 480 }
    ];
    const trackWidth = 90;

    // Carro
    const car = {
      x: 250,
      y: 580,
      angle: 0,
      speed: 0,
      maxSpeed: 10,
      accel: 0.18,
      friction: 0.97,
      turnSpeed: 0.045,
      onTrack: true
    };

    const keys = { w: false, s: false, a: false, d: false };

    window.addEventListener('keydown', e => setKey(e.key.toLowerCase(), true));
    window.addEventListener('keyup', e => setKey(e.key.toLowerCase(), false));

    function setKey(k, val) {
      if (k === 'w' || k === 'arrowup') keys.w = val;
      if (k === 's' || k === 'arrowdown') keys.s = val;
      if (k === 'a' || k === 'arrowleft') keys.a = val;
      if (k === 'd' || k === 'arrowright') keys.d = val;
    }

    btnPlay.addEventListener('click', () => {
      menu.classList.add('hidden');
      ui.classList.remove('hidden');
      car.x = waypoints[0].x;
      car.y = waypoints[0].y;
      car.angle = 0;
      car.speed = 0;
      lap = 1;
      nextCheckpoint = 1;
      startTime = performance.now();
      isPlaying = true;
    });

    // Distância até a pista
    function checkOnTrack(x, y) {
      let minDist = Infinity;
      for (let i = 0; i < waypoints.length; i++) {
        const a = waypoints[i];
        const b = waypoints[(i + 1) % waypoints.length];
        const l2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
        let t = ((x - a.x) * (b.x - a.x) + (y - a.y) * (b.y - a.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        const projX = a.x + t * (b.x - a.x);
        const projY = a.y + t * (b.y - a.y);
        const dist = Math.hypot(x - projX, y - projY);
        if (dist < minDist) minDist = dist;
      }
      return minDist <= (trackWidth / 2);
    }

    function update() {
      if (!isPlaying) return;

      car.onTrack = checkOnTrack(car.x, car.y);
      const topSpeed = car.onTrack ? car.maxSpeed : 3.5;

      if (keys.w) car.speed += car.accel;
      if (keys.s) car.speed -= car.accel * 0.7;

      car.speed *= car.friction;
      if (car.speed > topSpeed) car.speed = topSpeed;
      if (car.speed < -2) car.speed = -2;

      if (Math.abs(car.speed) > 0.2) {
        const dir = car.speed > 0 ? 1 : -1;
        if (keys.a) car.angle -= car.turnSpeed * dir;
        if (keys.d) car.angle += car.turnSpeed * dir;
      }

      car.x += Math.cos(car.angle) * car.speed;
      car.y += Math.sin(car.angle) * car.speed;

      // Verificação de Checkpoints e Voltas
      const target = waypoints[nextCheckpoint];
      if (Math.hypot(car.x - target.x, car.y - target.y) < trackWidth) {
        if (nextCheckpoint === 0) {
          lap++;
          if (lap > totalLaps) {
            alert('Parabéns! Corrida concluída!');
            isPlaying = false;
            menu.classList.remove('hidden');
            ui.classList.add('hidden');
          }
          nextCheckpoint = 1;
        } else {
          nextCheckpoint = (nextCheckpoint + 1) % waypoints.length;
        }
      }

      // Atualiza HUD
      uiLap.innerText = `${Math.min(lap, totalLaps)} / ${totalLaps}`;
      uiSpeed.innerText = Math.round(Math.abs(car.speed) * 32);
      const elapsed = (performance.now() - startTime) / 1000;
      uiTime.innerText = elapsed.toFixed(3) + 's';
      uiStatus.innerText = car.onTrack ? 'PISTA' : 'GRAMA';
      uiStatus.style.color = car.onTrack ? '#4cd137' : '#e1b12c';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Zebras
      ctx.strokeStyle = '#e10600';
      ctx.lineWidth = trackWidth + 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      waypoints.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.closePath();
      ctx.stroke();

      // Pista
      ctx.strokeStyle = '#2d3436';
      ctx.lineWidth = trackWidth;
      ctx.beginPath();
      waypoints.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.closePath();
      ctx.stroke();

      // Linha de Largada
      const start = waypoints[0];
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(start.x - 4, start.y - trackWidth / 2, 8, trackWidth);

      // Carro
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);

      // Rodas
      ctx.fillStyle = '#000';
      ctx.fillRect(-12, -10, 8, 4);
      ctx.fillRect(8, -10, 8, 4);
      ctx.fillRect(-12, 6, 8, 4);
      ctx.fillRect(8, 6, 8, 4);

      // Monocoque
      ctx.fillStyle = '#e10600';
      ctx.fillRect(-14, -7, 28, 14);

      // Bico / Asa dianteira
      ctx.fillStyle = '#fff';
      ctx.fillRect(14, -8, 4, 16);

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
